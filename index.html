<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>黑盒抄錶室：能量手痕 × 質能手痕 兩兄弟 × 雙軌1-7七和弦</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000000; color: #fff; height: 100dvh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #canvas-3d { position: fixed; inset: 0; width: 100%; height: 100%; }

    /* 底部純黑抄錶控制台（無毛玻璃） */
    #drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(0, 0, 0, 0.94); border-top: 1px solid #222;
      padding: 8px 12px 14px; max-height: 66dvh; overflow-y: auto;
    }
    #drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: bold; color: #ffd700; margin-bottom: 8px;
    }
    #tri-btn {
      background: none; border: none; color: #1e90ff; font-size: 16px; padding: 2px 8px; cursor: pointer;
    }
    .panel { display: flex; flex-direction: column; gap: 7px; }
    .panel.hidden { display: none; }

    .track-box {
      background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 6px; padding: 6px 8px;
    }
    .track-title {
      font-size: 10.5px; color: #aaa; margin-bottom: 5px; display: flex; justify-content: space-between;
    }
    .track-title b { color: #00ffcc; font-family: monospace; }

    .chord-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .c-btn {
      background: #141414; color: #bbb; border: 1px solid #2e2e2e; border-radius: 5px;
      padding: 4px 1px; font-size: 11px; font-weight: bold; text-align: center;
    }
    .c-btn small { display: block; font-size: 7.5px; color: #777; font-weight: normal; }
    .c-btn.active { background: #14284b; color: #fff; border-color: #1e90ff; }
    .c-btn.active small { color: #93c5fd; }

    /* 物理兄弟與開關列 */
    .toggle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .tri-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .p-toggle {
      background: #111; color: #777; border: 1px solid #333; border-radius: 6px;
      padding: 6px 4px; font-size: 11px; font-weight: bold; text-align: center;
    }
    .p-toggle.on-energy { background: #2b210e; color: #fbbf24; border-color: #f59e0b; }
    .p-toggle.on-mass   { background: #2d1226; color: #f472b6; border-color: #ec4899; }
    .p-toggle.on-chaos  { background: #132a1c; color: #4ade80; border-color: #22c55e; }
    .p-toggle.on-heis   { background: #251738; color: #c084fc; border-color: #a855f7; }
    .p-toggle.on-breath { background: #10253f; color: #38bdf8; border-color: #0ea5e9; }

    .row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .row label { min-width: 122px; color: #ccc; }
    .row input[type=range] { flex: 1; accent-color: #ffd700; }
    .row span { min-width: 44px; text-align: right; color: #ffd700; font-family: monospace; }
  </style>
</head>
<body>
  <div id="canvas-3d"></div>

  <div id="drawer">
    <div id="drawer-head">
      <span>📟 抄錶室：能量手痕 × 質能手痕 兩兄弟 × 雙軌七和弦</span>
      <button id="tri-btn">▼</button>
    </div>
    <div class="panel" id="panel">
      <!-- 軌道 A：天空光譜（純和弦半音算色） -->
      <div class="track-box">
        <div class="track-title">
          <span>🌌 軌道 A：天空光譜（純音程算色）</span>
          <b id="sky-readout">1級 Imaj7 [0,4,7,11]</b>
        </div>
        <div class="chord-grid" id="sky-grid">
          <button class="c-btn active" data-deg="1">1<small>Imaj7</small></button>
          <button class="c-btn" data-deg="2">2<small>ii7</small></button>
          <button class="c-btn" data-deg="3">3<small>iii7</small></button>
          <button class="c-btn" data-deg="4">4<small>IVmaj7</small></button>
          <button class="c-btn" data-deg="5">5<small>V7</small></button>
          <button class="c-btn" data-deg="6">6<small>vi7</small></button>
          <button class="c-btn" data-deg="7">7<small>viiø7</small></button>
        </div>
      </div>

      <!-- 軌道 B：地面沙場（波形＋沙色純音程算色） -->
      <div class="track-box">
        <div class="track-title">
          <span>🏜️ 軌道 B：地面沙場（波形＋沙色純音程算色）</span>
          <b id="sand-readout">7級 viiø7 [11,14,17,21]</b>
        </div>
        <div class="chord-grid" id="sand-grid">
          <button class="c-btn" data-deg="1">1<small>Imaj7</small></button>
          <button class="c-btn" data-deg="2">2<small>ii7</small></button>
          <button class="c-btn" data-deg="3">3<small>iii7</small></button>
          <button class="c-btn" data-deg="4">4<small>IVmaj7</small></button>
          <button class="c-btn" data-deg="5">5<small>V7</small></button>
          <button class="c-btn" data-deg="6">6<small>vi7</small></button>
          <button class="c-btn active" data-deg="7">7<small>viiø7</small></button>
        </div>
      </div>

      <!-- 手痕兩兄弟獨立開關（可單開、可雙開、可全關） -->
      <div class="toggle-grid">
        <button class="p-toggle on-energy" id="btn-energy">⚡ 能量手痕 (位動轉換): 開</button>
        <button class="p-toggle on-mass" id="btn-mass">☢️ 質能手痕 (E=mc²聚變): 開</button>
      </div>

      <!-- 三大背景物理開關 -->
      <div class="tri-grid">
        <button class="p-toggle on-chaos" id="btn-chaos">🌀 混沌仔仔: 開</button>
        <button class="p-toggle on-heis" id="btn-heis">⚛️ 測不準: 永動</button>
        <button class="p-toggle on-breath" id="btn-breath">🫁 呼吸閘門: 開</button>
      </div>

      <div class="row">
        <label>⚡ 能量手痕槓桿 (跳躍)</label>
        <input type="range" id="energyLev" min="0.1" max="2.5" step="0.05" value="1.15" />
        <span id="energyLev-v">1.15x</span>
      </div>
      <div class="row">
        <label>☢️ 質能手痕槓桿 (mc²)</label>
        <input type="range" id="massLev" min="0.1" max="2.5" step="0.05" value="1.20" />
        <span id="massLev-v">1.20x</span>
      </div>
      <div class="row">
        <label>🏜️ 浮沙粒子維數 (粒)</label>
        <input type="range" id="sandDim" min="0" max="800" step="20" value="360" />
        <span id="sandDim-v">360粒</span>
      </div>
      <div class="row">
        <label>🌀 混沌扭曲度 (Chaos)</label>
        <input type="range" id="chaosAmt" min="0" max="2.0" step="0.05" value="0.75" />
        <span id="chaosAmt-v">0.75</span>
      </div>
      <div class="row">
        <label>🛑 沙場最高Y限幅</label>
        <input type="range" id="maxY" min="0.05" max="0.60" step="0.01" value="0.24" />
        <span id="maxY-v">0.24m</span>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.2, 900);
    camera.position.set(-14, 5.5, 21);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-3d').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2.0, -3);

    const DIATONIC_7TH = {
      1: { label: '1級 Imaj7 [0,4,7,11]',   semi: [0, 4, 7, 11] },
      2: { label: '2級 ii7 [2,5,9,12]',     semi: [2, 5, 9, 12] },
      3: { label: '3級 iii7 [4,7,11,14]',   semi: [4, 7, 11, 14] },
      4: { label: '4級 IVmaj7 [5,9,12,16]', semi: [5, 9, 12, 16] },
      5: { label: '5級 V7 [7,11,14,17]',    semi: [7, 11, 14, 17] },
      6: { label: '6級 vi7 [9,12,16,19]',   semi: [9, 12, 16, 19] },
      7: { label: '7級 viiø7 [11,14,17,21]',semi: [11, 14, 17, 21] }
    };
    const toRatios = (semi) => semi.map(s => Math.pow(2, s / 12));

    // 1. 軌道 A：天空光譜（零自訂色，純音程半音算色）
    const skyUniforms = {
      uSkySemi: { value: new THREE.Vector4(0, 4, 7, 11) },
      uChaosOn: { value: 1.0 },
      uChaosAmt: { value: 0.75 },
      uHeisPhase: { value: 0.0 },
      uSunDir: { value: new THREE.Vector3(0.22, 0.24, -0.94).normalize() }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, uniforms: skyUniforms,
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform vec4 uSkySemi;
        uniform float uChaosOn, uChaosAmt, uHeisPhase;
        uniform vec3 uSunDir;
        varying vec3 vDir;

        vec3 pitchToSpectrum(float semitone, float shift) {
          float freq = pow(2.0, semitone / 12.0);
          vec3 phase = vec3(0.0, 0.333, 0.667) + freq * 0.42 + shift;
          return 0.5 + 0.5 * cos(6.28318 * phase);
        }

        void main() {
          vec3 d = normalize(vDir);
          float h = clamp(d.y, 0.0, 1.0);
          float chaosWarp = uChaosOn * sin(d.x * 4.5 + d.z * 3.8 + uHeisPhase * 0.4) * 0.08 * uChaosAmt;
          float quantumShift = uHeisPhase * 0.03;

          vec3 cRoot = pitchToSpectrum(uSkySemi.x, quantumShift + chaosWarp);
          vec3 c3rd  = pitchToSpectrum(uSkySemi.y, quantumShift - chaosWarp);
          vec3 c5th  = pitchToSpectrum(uSkySemi.z, quantumShift + chaosWarp * 0.5);
          vec3 c7th  = pitchToSpectrum(uSkySemi.w, quantumShift);

          vec3 col = mix(cRoot, c3rd, smoothstep(0.0, 0.22, h));
          col = mix(col, c5th, smoothstep(0.18, 0.55, h));
          col = mix(col, c7th, smoothstep(0.48, 0.95, h));

          float sunAmt = max(dot(d, normalize(uSunDir)), 0.0);
          float core = smoothstep(0.9993, 0.99985, sunAmt);
          float halo = pow(sunAmt, 90.0) * 0.45;
          col += (cRoot + c7th) * 0.5 * halo + vec3(1.0) * core * 1.4;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 28, 18), skyMat));

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.85));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.25);
    sunLight.position.set(22, 24, -90);
    scene.add(sunLight);

    // 2. 高腳咖啡木屋參照（0.25m 石屎底台）
    const cafeGroup = new THREE.Group();
    cafeGroup.position.set(0, 0, -6.5);
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8c5832, roughness: 0.55 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x3b2313, roughness: 0.45 });
    const basePad = new THREE.Mesh(new THREE.BoxGeometry(12.2, 0.25, 6.2), darkMat);
    basePad.position.y = 0.125;
    cafeGroup.add(basePad);

    [[-5.0, -2.0], [5.0, -2.0], [-5.0, 2.0], [5.0, 2.0]].forEach(([px, pz]) => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.28, 3.289, 0.28), darkMat);
      post.position.set(px, 0.25 + 1.64, pz);
      cafeGroup.add(post);
    });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(10.7, 2.55, 4.1), woodMat);
    cabin.position.y = 0.25 + 3.289 + 1.275;
    cafeGroup.add(cabin);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(11.4, 0.22, 4.8), darkMat);
    roof.position.y = 0.25 + 3.289 + 2.65;
    cafeGroup.add(roof);
    scene.add(cafeGroup);

    // 3. 軌道 B：地面沙場（七和弦波形 ＋ 零自訂色 ＋ 最高Y限幅）
    const sandUniforms = {
      uSandSemi: { value: new THREE.Vector4(11, 14, 17, 21) },
      uSandRatios: { value: new THREE.Vector4(...toRatios([11, 14, 17, 21])) },
      uChaosOn: { value: 1.0 },
      uChaosAmt: { value: 0.75 },
      uHeisPhase: { value: 0.0 },
      uMaxY: { value: 0.24 },
      uWindDir: { value: new THREE.Vector2(0.85, 0.52).normalize() },
      uSunDir: skyUniforms.uSunDir
    };

    const sandGeo = new THREE.PlaneGeometry(76, 76, 165, 165);
    sandGeo.rotateX(-Math.PI / 2);

    const sandMat = new THREE.ShaderMaterial({
      uniforms: sandUniforms,
      extensions: { derivatives: true },
      vertexShader: `
        uniform vec4 uSandRatios;
        uniform float uChaosOn, uChaosAmt, uHeisPhase, uMaxY;
        uniform vec2 uWindDir;
        varying vec3 vWorldPos;
        varying float vHeight;

        vec2 chaosFold(vec2 p, float amt, float heis) {
          vec2 z = p * 0.14;
          for (int i = 0; i < 3; i++) {
            z = abs(z) / max(dot(z, z), 0.15) - (1.15 + 0.12 * sin(heis * 0.7));
            z = mat2(0.8, -0.6, 0.6, 0.8) * z;
          }
          return z * amt * 1.4;
        }

        void main() {
          vec3 pos = position;
          vec2 cOffset = uChaosOn * chaosFold(pos.xz, uChaosAmt, uHeisPhase);
          vec2 samplePos = pos.xz + cOffset;

          float freq = 0.85;
          float tMove = uHeisPhase * 0.85;
          float w1 = sin(dot(samplePos, uWindDir) * freq * uSandRatios.x - tMove * 1.0);
          float w2 = sin(dot(samplePos, vec2(uWindDir.y, -uWindDir.x)*0.6 + uWindDir*0.8) * freq * uSandRatios.y - tMove * 1.25) * 0.75;
          float w3 = sin(dot(samplePos, uWindDir*0.9 - vec2(0.3, -0.4)) * freq * uSandRatios.z - tMove * 1.5) * 0.55;
          float w4 = sin(dot(samplePos, vec2(-uWindDir.y, uWindDir.x)) * freq * uSandRatios.w - tMove * 1.8) * 0.42;

          float rawY = ((w1 + w2 + w3 + w4) / 2.72) * 0.22 + 0.11;
          float finalY = min(uMaxY, max(0.0, rawY));

          pos.y = finalY;
          vHeight = finalY;
          vec4 wp = modelMatrix * vec4(pos, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec4 uSandSemi;
        uniform float uMaxY, uHeisPhase;
        uniform vec3 uSunDir;
        varying vec3 vWorldPos;
        varying float vHeight;

        vec3 pitchToSpectrum(float semitone, float shift) {
          float freq = pow(2.0, semitone / 12.0);
          vec3 phase = vec3(0.0, 0.333, 0.667) + freq * 0.42 + shift;
          return 0.5 + 0.5 * cos(6.28318 * phase);
        }

        void main() {
          vec3 N = normalize(cross(dFdy(vWorldPos), dFdx(vWorldPos)));
          if (N.y < 0.0) N = -N;

          float hRatio = clamp(vHeight / max(uMaxY, 0.01), 0.0, 1.0);
          float qShift = uHeisPhase * 0.025;

          vec3 valleyCol = mix(pitchToSpectrum(uSandSemi.y, qShift), pitchToSpectrum(uSandSemi.w, qShift), 0.5) * 0.48;
          vec3 crestCol  = mix(pitchToSpectrum(uSandSemi.x, qShift), pitchToSpectrum(uSandSemi.z, qShift), 0.5) * 0.92;
          vec3 baseSand  = mix(valleyCol, crestCol, hRatio);

          float diff = max(dot(N, normalize(uSunDir)), 0.22);
          vec3 col = baseSand * (0.45 + 0.80 * diff);
          float edgeDist = length(vWorldPos.xz) / 42.0;
          col *= mix(1.0, 0.65, smoothstep(0.4, 1.0, edgeDist));

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(sandGeo, sandMat));

    // 4. 【手痕兩兄弟粒子系統】：自定義 Shader 支援每粒沙獨立大小(質量 m)與發光亮度(能量 E=mc²)！
    const MAX_PARTICLES = 800;
    let activeParticles = 360;

    const pGeo = new THREE.BufferGeometry();
    const pPositions = new Float32Array(MAX_PARTICLES * 3);
    const pMassAttr  = new Float32Array(MAX_PARTICLES); // 每粒沙嘅動態質量 m
    const pEnergyAttr= new Float32Array(MAX_PARTICLES); // 每粒沙釋放嘅光能量 E
    const pPhases    = new Float32Array(MAX_PARTICLES);
    const pBaseSeeds = new Float32Array(MAX_PARTICLES);

    for (let i = 0; i < MAX_PARTICLES; i++) {
      pPositions[i * 3]     = (Math.random() - 0.5) * 42;
      pPositions[i * 3 + 1] = 0.03;
      pPositions[i * 3 + 2] = (Math.random() - 0.5) * 42;
      pMassAttr[i]   = 1.0;
      pEnergyAttr[i] = 0.5;
      pPhases[i]     = Math.random() * Math.PI * 2;
      pBaseSeeds[i]  = 0.45 + Math.random() * 0.85;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeo.setAttribute('aMass', new THREE.BufferAttribute(pMassAttr, 1));
    pGeo.setAttribute('aEnergy', new THREE.BufferAttribute(pEnergyAttr, 1));
    pGeo.setDrawRange(0, activeParticles);

    const pUniforms = {
      uChordColor: { value: new THREE.Color(1, 1, 1) },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 1.5) }
    };

    const pMat = new THREE.ShaderMaterial({
      uniforms: pUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aMass;
        attribute float aEnergy;
        uniform float uPixelRatio;
        varying float vEnergy;
        void main() {
          vEnergy = aEnergy;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          // 質量 m 越大，粒子體積越大（聚沙成塔）
          gl_PointSize = clamp((18.0 * aMass * uPixelRatio) / -mvPosition.z, 2.0, 26.0);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uChordColor;
        varying float vEnergy;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float soft = smoothstep(0.5, 0.08, d);
          // 能量 E 越高（質量轉化為光能），核心越白亮耀眼
          vec3 col = mix(uChordColor * 0.7, vec3(1.0, 0.98, 0.92), clamp(vEnergy * 0.85, 0.0, 1.0));
          gl_FragColor = vec4(col, soft * (0.45 + 0.55 * clamp(vEnergy, 0.0, 1.0)));
        }
      `
    });
    scene.add(new THREE.Points(pGeo, pMat));

    function syncParticleColorFromChord(semiArr) {
      const f = Math.pow(2, semiArr[3] / 12);
      const r = 0.55 + 0.45 * Math.cos(6.28318 * (0.0 + f * 0.42));
      const g = 0.55 + 0.45 * Math.cos(6.28318 * (0.333 + f * 0.42));
      const b = 0.55 + 0.45 * Math.cos(6.28318 * (0.667 + f * 0.42));
      pUniforms.uChordColor.value.setRGB(r, g, b);
    }
    syncParticleColorFromChord(DIATONIC_7TH[7].semi);

    // 5. 抄錶控制狀態
    let state = {
      energyOn: true,  // ⚡ 能量手痕 (mgh + 1/2 mv^2)
      massOn: true,    // ☢️ 質能手痕 (E = mc^2)
      chaosOn: true,
      heisOn: true,
      breathOn: true,
      energyLev: 1.15,
      massLev: 1.20,
      heisPhase: 0.0
    };

    const triBtn = document.getElementById('tri-btn');
    const panel = document.getElementById('panel');
    triBtn.onclick = () => {
      panel.classList.toggle('hidden');
      triBtn.textContent = panel.classList.contains('hidden') ? '▲' : '▼';
    };

    // 軌道 A 與 B 獨立七和弦按鈕
    document.querySelectorAll('#sky-grid .c-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#sky-grid .c-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const item = DIATONIC_7TH[parseInt(btn.dataset.deg, 10)];
        skyUniforms.uSkySemi.value.set(...item.semi);
        document.getElementById('sky-readout').textContent = item.label;
      };
    });

    document.querySelectorAll('#sand-grid .c-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#sand-grid .c-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const item = DIATONIC_7TH[parseInt(btn.dataset.deg, 10)];
        sandUniforms.uSandSemi.value.set(...item.semi);
        sandUniforms.uSandRatios.value.set(...toRatios(item.semi));
        syncParticleColorFromChord(item.semi);
        document.getElementById('sand-readout').textContent = item.label;
      };
    });

    // 手痕兩兄弟獨立開關
    const btnEnergy = document.getElementById('btn-energy');
    btnEnergy.onclick = () => {
      state.energyOn = !state.energyOn;
      btnEnergy.classList.toggle('on-energy', state.energyOn);
      btnEnergy.textContent = state.energyOn ? '⚡ 能量手痕 (位動轉換): 開' : '⚡ 能量手痕 (位動轉換): 關';
    };

        const btnMass = document.getElementById('btn-mass');
    btnMass.onclick = () => {
      state.massOn = !state.massOn;
      btnMass.classList.toggle('on-mass', state.massOn);
      btnMass.textContent = state.massOn ? '☢️ 質能手痕 (E=mc²聚變): 開' : '☢️ 質能手痕 (E=mc²聚變): 關';
    };

    // 三大背景開關
    const btnChaos = document.getElementById('btn-chaos');
    btnChaos.onclick = () => {
      state.chaosOn = !state.chaosOn;
      skyUniforms.uChaosOn.value = state.chaosOn ? 1.0 : 0.0;
      sandUniforms.uChaosOn.value = state.chaosOn ? 1.0 : 0.0;
      btnChaos.classList.toggle('on-chaos', state.chaosOn);
      btnChaos.textContent = state.chaosOn ? '🌀 混沌仔仔: 開' : '🌀 混沌仔仔: 停';
    };

    const btnHeis = document.getElementById('btn-heis');
    btnHeis.onclick = () => {
      state.heisOn = !state.heisOn;
      btnHeis.classList.toggle('on-heis', state.heisOn);
      btnHeis.textContent = state.heisOn ? '⚛️ 測不準: 永動' : '⚛️ 測不準: 凍結';
    };

    const btnBreath = document.getElementById('btn-breath');
    btnBreath.onclick = () => {
      state.breathOn = !state.breathOn;
      btnBreath.classList.toggle('on-breath', state.breathOn);
      btnBreath.textContent = state.breathOn ? '🫁 呼吸閘門: 開' : '🫁 呼吸閘門: 關';
    };

    // 推桿綁定
    document.getElementById('energyLev').oninput = (e) => {
      state.energyLev = parseFloat(e.target.value);
      document.getElementById('energyLev-v').textContent = state.energyLev.toFixed(2) + 'x';
    };
    document.getElementById('massLev').oninput = (e) => {
      state.massLev = parseFloat(e.target.value);
      document.getElementById('massLev-v').textContent = state.massLev.toFixed(2) + 'x';
    };
    document.getElementById('sandDim').oninput = (e) => {
      activeParticles = parseInt(e.target.value, 10);
      pGeo.setDrawRange(0, activeParticles);
      document.getElementById('sandDim-v').textContent = activeParticles + '粒';
    };
    document.getElementById('chaosAmt').oninput = (e) => {
      const v = parseFloat(e.target.value);
      skyUniforms.uChaosAmt.value = v;
      sandUniforms.uChaosAmt.value = v;
      document.getElementById('chaosAmt-v').textContent = v.toFixed(2);
    };
    document.getElementById('maxY').oninput = (e) => {
      const v = parseFloat(e.target.value);
      sandUniforms.uMaxY.value = v;
      document.getElementById('maxY-v').textContent = v.toFixed(2) + 'm';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const rawT = clock.getElapsedTime();

      let effectiveSpeed = 0.0;
      if (state.heisOn) {
        if (state.breathOn) {
          const breathGate = Math.pow(Math.max(0, Math.sin(rawT * 0.85)), 4.0);
          effectiveSpeed = breathGate * 1.45;
        } else {
          effectiveSpeed = 0.65;
        }
      }

      state.heisPhase += dt * effectiveSpeed;
      skyUniforms.uHeisPhase.value = state.heisPhase;
      sandUniforms.uHeisPhase.value = state.heisPhase;

      // 更新「能量手痕」同「質能手痕」兩兄弟物理引擎
      if (activeParticles > 0 && effectiveSpeed > 0.001) {
        const wX = sandUniforms.uWindDir.value.x;
        const wZ = sandUniforms.uWindDir.value.y;
        const maxCeil = sandUniforms.uMaxY.value * 1.55 * state.energyLev;

        for (let i = 0; i < activeParticles; i++) {
          pPhases[i] += dt * effectiveSpeed * 2.2 * pBaseSeeds[i];
          const wave = Math.abs(Math.sin(pPhases[i]));

          // 哥哥：⚡ 能量手痕 (E = mgh + 0.5 mv^2)
          let h = 0.02;
          let vHor = effectiveSpeed * 1.6;
          if (state.energyOn) {
            h = wave * maxCeil * pBaseSeeds[i];
            const potRatio = Math.min(1.0, h / Math.max(maxCeil, 0.05));
            const kinRatio = Math.max(0.05, 1.0 - potRatio * 0.85);
            vHor = Math.sqrt(2.0 * kinRatio) * effectiveSpeed * 3.0 * state.energyLev;
          }

          // 弟弟：☢️ 質能手痕 (E = mc^2)
          if (state.massOn) {
            const fusionCycle = 0.5 + 0.5 * Math.cos(pPhases[i] * 1.5 + i);
            pMassAttr[i]   = (0.4 + fusionCycle * 1.6) * state.massLev;
            pEnergyAttr[i] = (1.1 - fusionCycle * 0.9) * state.massLev;
          } else {
            pMassAttr[i]   = 0.85;
            pEnergyAttr[i] = 0.35;
          }

          let x = pPositions[i * 3] + wX * vHor * dt;
          let z = pPositions[i * 3 + 2] + wZ * vHor * dt;
          if (x > 21) x -= 42; if (x < -21) x += 42;
          if (z > 21) z -= 42; if (z < -21) z += 42;

          pPositions[i * 3]     = x;
          pPositions[i * 3 + 1] = 0.02 + h;
          pPositions[i * 3 + 2] = z;
        }
        pGeo.attributes.position.needsUpdate = true;
        pGeo.attributes.aMass.needsUpdate = true;
        pGeo.attributes.aEnergy.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
</body>
</html>
